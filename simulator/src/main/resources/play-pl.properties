ability.CITIZEN=Zwykły mieszkaniec. Nie masz zdolności specjalnej, ale Twój głos się liczy.
ability.MAFIOSO=Co noc razem z mafią wybierasz ofiarę.
ability.DETECTIVE=Co noc sprawdzasz, czy wybrany gracz jest mafią.
ability.DOCTOR=Co noc chronisz jednego gracza przed zabójstwem, nie dwa razy z rzędu tego samego.
ability.JOKER=Wygrywasz sam, jeśli zostaniesz stracony w głosowaniu od trzeciego dnia.
ability.DAY_SHOOTER=Raz w grze możesz w dzień zastrzelić gracza. Jeśli to nie mafia, giniesz razem z nim.
ability.AVENGER=Jeśli mafia zabije Cię w nocy, zabierasz ze sobą losowego mafiosa.
ability.GODFATHER=Zabijasz jak mafioso, ale detektyw widzi Cię jako niewinnego.
ability.BODYGUARD=Co noc chronisz gracza własnym życiem: jeśli mafia go zaatakuje, giniesz zamiast niego.
ability.BLACKMAILER=Co noc szantażujesz gracza: jego nocna akcja przepada, a w dzień nie może głosować.
ability.LOOKOUT=Co noc obserwujesz gracza i dowiadujesz się, kto go odwiedził.
ability.MAYOR=Twój głos liczy się podwójnie. Nikt o tym nie wie.
ability.SHERIFF=Raz w grze poznajesz dokładną rolę wybranego gracza.
ability.POISONER=Dwa razy w grze możesz otruć gracza. Umrze pod koniec następnej nocy, chyba że lekarz go ochroni.

